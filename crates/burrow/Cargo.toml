[package]
name = "burrow"
description = "Burrow: an open-source, Arc-style browser built on CEF."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
burrow-core.workspace = true
cef.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard = { version = "3", default-features = false }

# Windows toasts for web notifications (D-042).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_System_Com"] }

[build-dependencies]
embed-resource = "3"
